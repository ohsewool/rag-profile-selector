# The corpus tests that matter most cannot run on every push.
#
# Documents are not redistributed, so a fresh clone has a manifest and no files,
# and **49 tests skip** - nine in `test_kr_law_corpus.py` that check the fetched
# statutes are segmented by article, that identifiers are unique, that 제7조 and
# 제7조의2 did not collapse together, and that no document is the frameset an
# early parser mistook for a statute; and sixteen in `test_stratification.py`
# that check the overlap tool measures real text, and twelve in
# `test_published_kr_law_numbers.py` that re-run both experiments and compare
# every number in `KR_LAW_RESULTS.md` against the run, and twelve in
# `test_published_corpus_size.py` that compare the sizes six documents publish
# (14 statutes, 745 retrievable articles, 40 queries) against the corpus itself.
# That last file was added because nothing measured those three numbers at all -
# they appeared in six documents and in none of the checks. Those are the tests that
# say the corpus is what the manifest claims **and** that the published table is
# what the code produces - two different claims that need to hold together.
#
# This comment said "nine" until 2026-08-22. It was right when written, and then
# sixteen more skips were added and nobody measured. The `tests` workflow now
# compares the without-corpus numbers against the README, so the next drift is a
# failing job rather than a stale sentence.
#
# Fetching on every push would hit a public government API for no reason, so
# this runs weekly instead. It has a second use: a statute that gets amended
# changes its checksum, and this job is what says so. A mismatch here is not a
# broken build - it means the experiment's numbers were computed on text that no
# longer exists, which is worth being told.

name: corpus

on:
  schedule:
    - cron: "37 4 * * 1"     # Mondays, off the hour
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check out document-intelligence
        uses: actions/checkout@v4
        with:
          repository: ohsewool/document-intelligence
          path: .sibling/document-intelligence

      - name: Fetch the statutes
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_kr_law_corpus.py --out /tmp/fresh --limit 14

      - name: Say plainly when the source could not be reached
        if: steps.fetch.outcome == 'failure'
        run: |
          # 국가법령정보 OPEN API times out from GitHub's runners. It answers when
          # this is run from elsewhere, so the corpus is fine and the network
          # path is not.
          #
          # This job used to fail here, which put "the statutes changed" and "I
          # could not reach the statutes" behind the same red mark. They call
          # for opposite responses: one means the experiment's numbers describe
          # text that no longer exists, the other means nothing was learned
          # today. Conflating them is the mistake this whole project keeps
          # finding in its own checks - an unverified alarm costs attention
          # exactly as an unverified all-clear costs trust.
          echo "::warning::국가법령정보 API에 접속하지 못해 이번 회차는 아무것도 검증하지 못했습니다."
          echo "::warning::코퍼스가 바뀐 것이 아니라 확인을 못 한 것입니다. 로컬에서 scripts/fetch_kr_law_corpus.py 로 확인하세요."

      - name: Compare against the committed manifest
        if: steps.fetch.outcome == 'success'
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          committed = json.loads(Path("data/kr_law/manifest.json").read_text(encoding="utf-8"))
          fresh = json.loads(Path("/tmp/fresh/manifest.json").read_text(encoding="utf-8"))

          old, new = committed["checksums"], fresh["checksums"]
          # index.json records retrieval order and counts, so it moves whenever
          # anything else does; comparing it would report every drift twice.
          documents = {k for k in old if k.startswith("documents/")}

          missing = sorted(documents - set(new))
          added = sorted(k for k in new if k.startswith("documents/") and k not in old)
          changed = sorted(k for k in documents & set(new) if old[k] != new[k])

          for label, items in (("사라짐", missing), ("새로 나타남", added), ("내용 변경", changed)):
              for item in items:
                  print(f"::warning::{label}: {item}")

          if missing or added or changed:
              print(f"::warning::법령 {len(missing) + len(added) + len(changed)}건이 "
                    "커밋된 매니페스트와 다릅니다. 실험 수치는 지금 받은 본문이 아니라 "
                    "매니페스트가 기록한 본문에 대한 것입니다.")
          else:
              print("모든 법령이 커밋된 체크섬과 일치합니다.")
          PY

      - name: Run the corpus tests against the fetched documents
        if: steps.fetch.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/.sibling/document-intelligence/src
        run: |
          # The fetched corpus stands in for the gitignored one, so the tests
          # that skip on every push actually execute here. Both files need it:
          # test_kr_law_corpus reads the statutes, test_stratification measures
          # query/article overlap. A test that skips everywhere is a test that
          # does not exist.
          cp -r /tmp/fresh/documents data/kr_law/documents
          cp /tmp/fresh/index.json data/kr_law/index.json
          cp /tmp/fresh/manifest.json data/kr_law/manifest.json
          python -m pytest tests/test_kr_law_corpus.py tests/test_stratification.py -q -rs

      - name: Check the README's headline numbers against a real run
        if: steps.fetch.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/.sibling/document-intelligence/src
          TOKENIZERS_PARALLELISM: "false"
        run: |
          # Test counts are checked on every push; these cannot be, because
          # producing them means embedding 745 articles. So they are checked
          # here, where the corpus is already fetched.
          #
          # The reason they need checking at all: a hand-maintained number
          # drifts. Two test counts in this project did, one of them in a README
          # I had verified days earlier.
          pip install torch transformers --quiet
          # `|| true`로 종료 코드를 삼키면 **실험이 죽어도 이 단계가 계속 간다.**
          # 아래 확인은 그때 "숫자를 못 찾았다"는 경고 셋을 내고 초록불로 끝난다 —
          # 바로 다음 단계가 "검사가 아무것도 확인 못 했으면 실패"라는 원칙을 이미
          # 쓰고 있는데 여기만 안 쓰고 있었다.
          if ! python experiments/kr_law_retrieval.py > /tmp/run.txt 2>&1; then
            echo "::error::실험이 실패했다. 아래 수치 확인은 아무것도 확인할 수 없다."
            tail -40 /tmp/run.txt
            exit 1
          fi
          tail -40 /tmp/run.txt

          python - <<'CHECK'
          import re, sys
          from pathlib import Path

          output = Path("/tmp/run.txt").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          # 기대값이 워크플로와 README 두 곳에 산다. 한 곳을 소스로 삼으려고
          # README에서 파싱해봤다가 되돌렸다: 이 수치들은 표가 아니라 산문 안에
          # 있어서("dense 단독(0.714)보다 나쁘다"), 문장을 다듬는 것만으로 정규식이
          # 값을 놓친다. 그리고 이 단계는 실패가 아니라 경고를 내므로 **검사기가
          # 조용히 아무것도 안 하게 된다** - 두 곳에 사는 것보다 나쁜 실패다.
          #
          # 대신 아래 `expected not in readme`가 고리를 닫는다: README에서 숫자가
          # 사라지거나 바뀌면 여기서 걸린다. 두 곳이되, 어긋나면 잡힌다.
          claims = {
              "dense MRR": (r"dense\s+([0-9.]+)", "0.714"),
              "hybrid-all MRR": (r"hybrid-all\s+([0-9.]+)", "0.562"),
              "headroom": (r"headroom\s+:\s+([0-9.]+)", "0.1071"),
          }
          drifted, missing = [], []
          for label, (pattern, expected) in claims.items():
              found = re.search(pattern, output)
              if not found:
                  missing.append(f"{label}: not present in the run output")
              elif found.group(1) != expected:
                  drifted.append(f"{label}: README says {expected}, run produced {found.group(1)}")
              elif expected not in readme:
                  missing.append(f"{label}: {expected} no longer appears in the README")

          # **두 가지 실패를 갈라 놓는다.**
          #
          #   흘러감  — 값이 있는데 다르다. 임베딩 모델이나 라이브러리 판이 바뀌면
          #             정당하게 움직인다. 경고로 남기고 사람이 판단한다.
          #   못 찾음 — 출력에 그 값이 아예 없다. 드리프트가 아니라 **이 확인이
          #             아무것도 확인하지 못했다**는 뜻이다.
          #
          # 처음엔 둘 다 경고였다. 2026-08-24에 실험 출력 대신 트레이스백을 넣어
          # 돌려보니 경고 셋에 종료 코드 0이었다 — 실험이 통째로 죽어도 초록불이다.
          for line in drifted:
              print(f"::warning::{line}")
          for line in missing:
              print(f"::error::{line}")
          if missing:
              print(f"{len(missing)}건은 값을 찾지도 못했다 — 이 단계는 아무것도 확인하지 않았다.")
              sys.exit(1)
          print("모든 수치 일치" if not drifted else f"{len(drifted)}건 흘러감(경고)")
          # A warning rather than a failure: an embedding model or library
          # version can move these legitimately, and a red build every time a
          # dependency updates is a build people stop reading. The drift is
          # reported so someone decides.
          CHECK

      - name: Refuse a run where the corpus tests skipped anyway
        if: steps.fetch.outcome == 'success'
        env:
          PYTHONPATH: ${{ github.workspace }}/.sibling/document-intelligence/src
        run: |
          # `grep` exits 1 when it matches nothing, and the step runs under
          # `bash -e`. The first version of this guard therefore aborted in the
          # one case it was meant to accept: a run with no skips at all. It
          # reported failure over a clean result - which is worse than the
          # silence it was written to break, because it teaches people to
          # ignore the job.
          summary=$(python -m pytest tests/test_kr_law_corpus.py \
            tests/test_stratification.py -q 2>/dev/null | tail -1)
          echo "$summary"
          skipped=$(printf '%s' "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '^[0-9]+' || true)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::$skipped corpus test(s) skipped after fetching; this job verified nothing."
            exit 1
          fi
          echo "no corpus test skipped; the fetched documents were actually checked"
