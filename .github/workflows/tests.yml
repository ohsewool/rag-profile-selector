# Tests do not prove anything if they quietly stop running.
#
# Every job below asserts how many tests were collected. A dependency that
# vanishes turns importorskip into a silent pass: this repository would go from
# 177 tests to 151 and still show green. The count is the difference between
# "the tests passed" and "the tests ran".

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # grounding needs the sibling repository. Without it, importorskip drops
      # 26 tests and the run still passes - which is the failure this job is
      # built to catch, so the dependency is installed rather than tolerated.
      - name: Check out document-intelligence
        uses: actions/checkout@v4
        with:
          repository: ohsewool/document-intelligence
          path: .sibling/document-intelligence

      - name: Install the sibling
        run: pip install -e .sibling/document-intelligence

      - name: The floor this replaced could not see what it was named for
        # 여기 있던 것은 `Refuse a silently shrinking suite`였고 두 가지가 틀렸다.
        #
        # **하나.** 보는 것이 `pytest --collect-only`의 수집 수인데, 런타임 skip은
        # 수집 수를 바꾸지 않는다. 픽스처 안에서 `pytest.skip()`이 불려도 테스트는
        # 이미 수집된 뒤다. 이름이 말하는 바로 그것을 구조적으로 볼 수 없었다.
        # 2026-08-24에 `document-intelligence`에서 재봤다 — 샘플 PDF를 못 받자
        # **32개가 조용히 skip**됐는데 수집 수는 234 그대로였고 관문은 통과시켰다.
        #
        # **둘.** 하한이 실제보다 한참 낮았다. 네 저장소를 세어보니 이랬다.
        #
        #     agent-safety-core   하한 288 · 실제  565  → 277개가 사라져도 통과
        #     mcp-gateway         하한 146 · 실제  379  → 233개
        #     rag-profile-selector 하한 177 · 실제  348  → 171개
        #     modelmate           하한 281 · 실제 1156  → 875개
        #
        # 합쳐 **1,556개가 사라져도 네 관문 전부 초록불**이다. 하한선은 목록이
        # 줄어드는 것만 보고, 목록이 현실에서 멀어지는 것은 못 본다.
        #
        # 지우고 끝내는 것이 아니라 **두 일을 이미 하는 것들이 있다.**
        #   수집 수  → 바로 아래 "README가 자기 수를 맞게 센다"가 **정확히** 비교한다
        #   런타임 skip → `conftest.py`의 EXPECTED_SKIPS 훅이 집합으로 지킨다
        #
        # 2026-08-24에 document-intelligence만 고치고 나머지 셋을 세지 않았다.
        # **하나를 찾으면 몇 개인지 세는 것**이 이 포트폴리오의 규칙인데 그때
        # 어겼고, 한 회차 뒤에 같은 것이 세 곳에 더 있는 것을 발견했다.
        run: echo "수집 수는 아래 단계가, 건너뛰기는 conftest의 EXPECTED_SKIPS가 지킨다"

      - name: Refuse a README that miscounts its own tests
        run: |
          # These numbers were hand-maintained and drifted twice - the second
          # time in a repository whose README I had just verified. A count kept
          # by hand is a count that rots, so CI compares them.
          claimed=$(grep -oE '[0-9]+ tests' README.md | head -1 | grep -oE '^[0-9]+')
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          echo "README says ${claimed:-none}, pytest collects ${collected:-none}"
          if [ "${claimed:-0}" != "${collected:-1}" ]; then
            echo "::error::README claims ${claimed} tests; ${collected} are collected."
            exit 1
          fi

      # 수집 수 비교는 skip을 볼 수 없다 — skip된 테스트도 수집된다. 그래서 위
      # 검사가 초록불인 채로 README가 "286 tests"라고 말하는 동안, 갓 클론한
      # 저장소에서는 **261 통과 · 25 skip**이었다. 코퍼스 본문은 재배포하지 않으니
      # CI도 그 상태로 돈다 — 여기서 재서 README와 대조한다.
      #
      # `.github/workflows/corpus.yml`의 머리말은 "nine tests skip"이라고 적혀
      # 있었다. 쓸 당시엔 맞았고, 그 뒤 층화 테스트 16개가 추가되며 25가 됐는데
      # 아무도 재지 않아 그대로 남아 있었다. 사람이 손으로 적은 숫자는 썩는다.
      - name: Run the suite and compare the without-corpus numbers
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee run.txt   # -rs names every skip and why
          passed=$(grep -oE '[0-9]+ passed' run.txt | tail -1 | grep -oE '^[0-9]+')
          skipped=$(grep -oE '[0-9]+ skipped' run.txt | tail -1 | grep -oE '^[0-9]+')
          claimed_pass=$(grep -oE '[0-9]+ 통과 · [0-9]+ skip' README.md | head -1 \
            | grep -oE '^[0-9]+')
          claimed_skip=$(grep -oE '[0-9]+ 통과 · [0-9]+ skip' README.md | head -1 \
            | grep -oE '[0-9]+ skip' | grep -oE '^[0-9]+')
          echo "measured: ${passed:-none} passed, ${skipped:-none} skipped"
          echo "README:   ${claimed_pass:-none} passed, ${claimed_skip:-none} skipped"
          if [ "${passed:-0}" != "${claimed_pass:-1}" ] || [ "${skipped:-0}" != "${claimed_skip:-1}" ]; then
            echo "::error::README's without-corpus numbers do not match a measurement."
            echo "The corpus body is gitignored, so this job runs without it."
            exit 1
          fi
          if [ "${skipped:-0}" -eq 0 ]; then
            echo "::error::nothing skipped; this job is supposed to run without the corpus."
            echo "If the corpus is present here, the comparison means nothing."
            exit 1
          fi

          # README는 같은 사실을 **두 곳**에서 말한다: `# N tests` 주석과 "코퍼스를
          # 받으면 N개가 전부 돈다"는 산문. 위 잡은 앞의 것만 대조했고, 산문 쪽은
          # 아무도 보지 않아 갱신에서 빠졌다(2026-08-22, 298에 멈춰 있었다).
          # **한 사실을 두 곳에 적으면 둘 다 검사해야 한다.**
          claimed_prose=$(grep -oE '돌리면 [0-9]+개가 전부 돈다' README.md \
            | grep -oE '[0-9]+')
          if [ -z "${claimed_prose}" ]; then
            echo "::error::README에서 산문 쪽 전체 수를 읽지 못했다. 문장이 바뀌었으면"
            echo "이 비교는 아무것도 확인하지 않는다 - 빈 값으로 통과시키지 않는다."
            exit 1
          fi
          total=$((${passed:-0} + ${skipped:-0}))
          echo "산문: ${claimed_prose}, 측정 합계: ${total}"
          if [ "${claimed_prose}" != "${total}" ]; then
            echo "::error::README 산문은 ${claimed_prose}개라고 하는데 합계는 ${total}개다."
            exit 1
          fi

      - name: Refuse a line this suite never executes
        # A coverage sweep on 2026-08-22 found 9 statements no test ever ran.
        # Nearly all of them were degenerate-input early returns - an empty
        # result set, a top score of zero, nothing to compare - which is to say
        # the features had never been computed for a query that found nothing.
        #
        # Measured without the corpus too, which is how this job runs: still
        # 100%. So the gate belongs here rather than in the weekly corpus job.
        #
        # 100% is a gate, not a target. A new branch either gets a test or gets
        # `# pragma: no cover` with a reason beside it.
        #
        # `--branch`, added a day later: a statement gate says every line ran,
        # not that every `if` went both ways. One arc was left, and the side
        # never taken was the *healthy* one - every test that passed splits to
        # `validate_evidence_mapping` had deliberately broken them, so "a sound
        # corpus produces no problems" had never been checked.
        run: |
          pip install -q coverage
          python -m coverage run --branch --source=rag_profile_selector -m pytest -q > /dev/null
          python -m coverage report -m --fail-under=100

      - name: Record what the experiment and script code actually covers
        # The gate above says 100% and means **100% of `rag_profile_selector`**.
        # Outside it sit `experiments/` and `scripts/` - about 1,100 statements,
        # and they are the code that produced the numbers this repository
        # publishes. Measured 2026-08-23: 69% overall, with
        # `kr_law_selection.py` at 21% and `fetch_kr_law_corpus.py` at 0%.
        #
        # They are not gated, on purpose. `fetch_kr_law_corpus.py` downloads a
        # corpus; gating it at 100% would mean fetching on every push. The rest
        # are one-shot research scripts whose value is the recorded output, not
        # reusability.
        #
        # Not gating is a decision. Not knowing is not. This prints the figure
        # and does not fail the build.
        continue-on-error: true
        run: |
          python -m coverage run --branch --source=experiments,scripts -m pytest -q > /dev/null
          python -m coverage report -m
